# Levanta TODO (servicio web + Ollama local):  docker compose up --build
# Luego abre:  http://localhost:8000
#
# Tras el primer arranque, baja los modelos de Ollama (una sola vez, opcional):
#   docker compose exec ollama ollama pull gemma3:4b     # estructurador (texto→JSON)
#   docker compose exec ollama ollama pull qwen2.5vl:3b  # OCR de visión (opcional, lento en CPU)
#
# Ingesta por lotes: deja los documentos en ./ingesta/1_entrada/<canal>/ con la nomenclatura
#   cedula_TIPODOC.ext  (la fecha sale del OCR; ver ingesta/LEEME.md). Programada:
#   INGESTA_CRON="0 2 * * *" docker compose up -d incapacidad-ocr
services:
  incapacidad-ocr:
    build: .
    image: incapacidad-ocr:latest
    container_name: incapacidad-ocr
    ports:
      # Enlazado SOLO a localhost (no expuesto a la LAN): los documentos contienen PII.
      - "127.0.0.1:8000:8000"
    environment:
      # El servicio web alcanza a Ollama por el nombre de servicio en la red de compose.
      - OLLAMA_URL=http://ollama:11434
      # Modelos de Ollama (fijados por el servidor; el cliente no puede elegirlos).
      - OCR_MODEL=qwen2.5vl:3b   # VLM que transcribe (OCR de visión); moondream NO sirve
      - LLM_MODEL=gemma3:4b
      - OLLAMA_TIMEOUT=900       # visión en CPU es lenta → timeout amplio (s)
      # - VISION_MAX_DIM=1200    # (opcional) px del lado mayor enviado al VLM
      # - MAX_UPLOAD_BYTES=26214400   # (opcional) tope de subida en bytes
      # Conexión a la BD ASTGU (tabla staging lp_ausentismos_ia).
      # Valores reales en .env (no versionado); si falta, cae al servicio local `db`.
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ASTGU}
      - DB_USER=${DB_USER:-ocr}
      - DB_PASSWORD=${DB_PASSWORD:-ocr}
      # Carpeta de ingesta masiva (bind mount abajo). Los feeders dejan los documentos en
      # 1_entrada/ con la nomenclatura cedula_TIPODOC.ext; el runner los procesa y los
      # mueve a 3_archivo/ (completos) o 2_revisar/ (necesitan acción humana).
      - INGESTA_ROOT=/data/ingesta
      # Corrida PROGRAMADA de la ingesta (cron in-process). Vacío = desactivada.
      # Ej.: INGESTA_CRON="0 2 * * *" procesa la carpeta cada día a las 02:00 (zona BATCH_TZ).
      - INGESTA_CRON=${INGESTA_CRON:-}
      - BATCH_TZ=${BATCH_TZ:-America/Bogota}
      - INGESTA_EXTRACTOR=${INGESTA_EXTRACTOR:-rule}
      # Declara que la BD de este stack es de PRUEBA: habilita que «Reiniciar prueba» VACÍE
      # la tabla de staging (no solo las filas de esos archivos). NO poner en producción:
      # es la única salvaguarda que impide vaciar el staging de la BD ASTGU real.
      - RESET_BD_PRUEBA=${RESET_BD_PRUEBA:-1}
    volumes:
      - ./ingesta:/data/ingesta
    depends_on:
      - ollama
      - db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama   # persiste los modelos descargados
    # SIN puertos publicados al host: Ollama no tiene autenticación, así que solo es
    # accesible desde la red interna de compose (el contenedor web). Para usarlo desde
    # el host, descomenta y enlázalo a localhost:  ports: ["127.0.0.1:11434:11434"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8
    container_name: ocr-db
    environment:
      - MYSQL_DATABASE=ASTGU
      - MYSQL_USER=ocr
      - MYSQL_PASSWORD=ocr
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - db-data:/var/lib/mysql
      # Carga catálogos + tabla staging + datos de prueba en el PRIMER arranque.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Catálogo CIE-10 completo (14.484 códigos) + tabla `lpeps`, que init.sql no crea. Se
      # monta aquí para que un `docker compose up` en una máquina nueva quede OPERATIVO sin
      # ejecutar nada más: sin este archivo la señal «el diagnóstico no existe» queda apagada
      # y el checklist de radicación degrada a [] en silencio. Lo genera
      # `scripts/cargar_catalogos.py` a partir de datos/cie10.csv, y ese mismo script lo
      # aplica sobre una BD que YA existía (initdb solo corre con el volumen vacío).
      - ./sql/catalogos_publicos.sql:/docker-entrypoint-initdb.d/02_catalogos.sql:ro
    ports:
      # Enlazado SOLO a localhost, nunca a la LAN (contiene PII de salud). Se publica para
      # poder (a) inspeccionar con un cliente MySQL y (b) correr la app FUERA de Docker
      # contra esta BD de prueba (DB_HOST=127.0.0.1), que es como se hacen las pruebas
      # locales. En producción, si la app corre en el mismo compose, esta línea puede
      # quitarse: los contenedores se ven por la red interna sin publicar nada.
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ollama-models:
  db-data:
